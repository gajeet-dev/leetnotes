[project]
name = "leetnotes"
version = "0.1.0"
description = "Leetcode notes management app"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "markdownify>=1.2.3",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "requests-ratelimiter>=0.10.0",
    "structlog>=26.1.0",
]


[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "pytest>=8.0.0",
    "ruff>=0.16.5",
]
