{% load static tailwind_cli %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Leetnotes{% endblock %}</title>
    {% tailwind_css %}
    <link rel="stylesheet" href="{% static 'ui/vendor/basecoat.min.css' %}" />
    <script>
      // Initialize dark mode before DOM renders to prevent flash
      if (
        localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <script src="{% static 'ui/vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'ui/vendor/basecoat-all.min.js' %}" defer></script>
    <script src="{% static 'ui/sidebar-responsive.js' %}" defer></script>
  </head>
  <body class="bg-zinc-100 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% include "ui/partials/sidebar.html" %}
    <main class="p-6">
      <button
        type="button"
        class="btn mb-4 md:hidden"
        onclick="document.getElementById('sidebar')?.toggle()"
      >
        Menu
      </button>
      {% block content %}{% endblock %}
    </main>

    <!-- Global Toast Notifications Container -->
    <div
      id="toast-container"
      class="fixed top-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none w-full max-w-sm px-4 sm:px-0"
    ></div>

    <script>
      function dismissToast(el) {
        if (!el || el.dataset.dismissing) return;
        el.dataset.dismissing = 'true';
        el.classList.add('opacity-0', '-translate-y-2');
        setTimeout(function() {
          el.remove();
        }, 250);
      }

      function initToast(el) {
        if (!el || el.dataset.toastInit) return;
        el.dataset.toastInit = 'true';
        if (el.dataset.persistent === 'true') return;
        setTimeout(function() {
          dismissToast(el);
        }, 4000);
      }

      document.addEventListener('htmx:load', function(evt) {
        var target = evt.detail.elt;
        if (!target) return;
        if (target.classList && target.classList.contains('toast-notification')) {
          initToast(target);
        }
        if (target.querySelectorAll) {
          target.querySelectorAll('.toast-notification').forEach(initToast);
        }
      });

      // Auto-detect and sync browser device timezone on first app load
      (function() {
        if (!localStorage.getItem('tz_synced')) {
          try {
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (tz) {
              fetch("{% url 'ui:set_timezone' %}", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({ timezone: tz })
              }).then(function(res) {
                if (res.ok) {
                  localStorage.setItem('tz_synced', 'true');
                }
              }).catch(function() {});
            }
          } catch (e) {}
        }
      })();
    </script>
  </body>
</html>
