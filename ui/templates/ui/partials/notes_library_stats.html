<div id="notes-library-stats" class="grid grid-cols-1 gap-3.5 sm:grid-cols-2">
  <!-- Solved Problems -->
  <div class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm transition-all hover:border-zinc-300 dark:border-zinc-800 dark:bg-zinc-950 dark:hover:border-zinc-700">
    <p class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Solved problems</p>
    <p class="mt-2 text-3xl font-bold tracking-tight text-zinc-900 dark:text-zinc-50">
      {{ solved_count }}
    </p>
  </div>

  <!-- AI Prefills -->
  <div class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm transition-all hover:border-zinc-300 dark:border-zinc-800 dark:bg-zinc-950 dark:hover:border-zinc-700">
    <p class="text-xs font-medium text-zinc-500 dark:text-zinc-400">AI prefills</p>
    <p class="mt-2 text-3xl font-bold tracking-tight text-zinc-900 dark:text-zinc-50">
      {{ ai_prefills_count }}
    </p>
  </div>

  <!-- Notes Created -->
  <div class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm transition-all hover:border-zinc-300 dark:border-zinc-800 dark:bg-zinc-950 dark:hover:border-zinc-700">
    <p class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Notes created</p>
    <p class="mt-2 text-3xl font-bold tracking-tight text-zinc-900 dark:text-zinc-50">
      {{ notes_created_count }}
    </p>
  </div>

  <!-- Needs Attention -->
  <div class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm transition-all hover:border-zinc-300 dark:border-zinc-800 dark:bg-zinc-950 dark:hover:border-zinc-700">
    <p class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Needs attention</p>
    <p class="mt-2 text-3xl font-bold tracking-tight {% if needs_attention_count > 0 %}text-amber-600 dark:text-amber-400{% else %}text-zinc-900 dark:text-zinc-50{% endif %}">
      {{ needs_attention_count }}
    </p>
  </div>
</div>
