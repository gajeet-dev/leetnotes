<div id="output-dir-status-badge"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  {% if output_dir_exists %}
    <span class="inline-flex items-center gap-1 rounded-md bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-400 shrink-0">
      {% lucide "check" class="w-3 h-3" size=12 %}
      Directory exists on disk
    </span>
  {% elif output_dir %}
    <span class="inline-flex items-center gap-1 rounded-md bg-amber-50 px-2 py-0.5 text-xs font-medium text-amber-700 dark:bg-amber-950/40 dark:text-amber-400 shrink-0">
      {% lucide "triangle-alert" class="w-3 h-3" size=12 %}
      Directory does not exist
    </span>
  {% endif %}
</div>
