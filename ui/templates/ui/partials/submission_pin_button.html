{% if submission %}
<button
  id="submission-pin-btn-{{ submission.id }}"
  type="button"
  hx-post="{% url 'ui:toggle_submission_pin' submission.id %}"
  hx-target="#submission-pin-btn-{{ submission.id }}"
  hx-swap="outerHTML"
  class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-xs font-medium transition-all cursor-pointer {% if submission.pinned %}border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 dark:border-amber-900/60 dark:bg-amber-950/40 dark:text-amber-400 dark:hover:bg-amber-900/50{% else %}border border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-50 hover:text-zinc-900 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-white{% endif %}"
  title="{% if submission.pinned %}Pinned solution is protected from being overwritten. Click to unpin.{% else %}Pin this submission to protect it from being overwritten by newer submissions.{% endif %}"
>
  {% if submission.pinned %}
  <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15 8 22 9 17 14 18 21 12 17 6 21 7 14 2 9 9 8 12 2"/></svg>
  <span>Pinned</span>
  {% else %}
  <span>Unpinned</span>
  {% endif %}
</button>
{% endif %}
