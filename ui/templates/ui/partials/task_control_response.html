{% include "ui/partials/task_live_stats.html" %}

<!-- OOB update for header badge -->
<div id="task-header-status-badge" hx-swap-oob="innerHTML">
  <span class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-medium {{ status_badge_class }}">
    {{ status_label }}
  </span>
</div>

<!-- OOB update for overflow menu action buttons -->
<div id="task-overflow-menu-actions" hx-swap-oob="innerHTML">
  {% include "ui/partials/task_overflow_actions.html" %}
</div>

<!-- OOB update for live poller -->
<div
  id="task-live-poller"
  hx-swap-oob="outerHTML"
  {% if has_active_work %}
  hx-get="{% url 'ui:task_live_status' task.id %}"
  hx-trigger="every 2s"
  hx-swap="outerHTML"
  {% endif %}
></div>
