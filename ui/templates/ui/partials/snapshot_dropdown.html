{% load lucide %}

<div
  id="snapshot-dropdown-container"
  {% if oob %}hx-swap-oob="outerHTML:#snapshot-dropdown-container"{% endif %}
  class="flex flex-col gap-1"
>
  <label for="import-snapshot-filename" class="text-xs font-medium text-zinc-700 dark:text-zinc-300">
    Select Snapshot
  </label>

  <!-- Basecoat UI Dropdown for Snapshot Selection -->
  <div class="dropdown-menu w-full relative" id="snapshot-dropdown">
    <button
      type="button"
      id="snapshot-trigger-btn"
      class="h-8 w-full inline-flex items-center justify-between rounded-md border border-zinc-300 bg-white px-2.5 text-xs text-zinc-900 focus:border-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900 dark:border-zinc-700 dark:bg-zinc-950 dark:text-zinc-100 shadow-2xs transition-colors cursor-pointer"
      aria-expanded="false"
    >
      <span id="snapshot-selected-label" class="font-normal text-left truncate font-mono text-xs">
        {% if selected_snapshot %}{{ selected_snapshot }}{% elif available_snapshots %}{{ available_snapshots.0.filename }}{% else %}No snapshots found in db_snapshots/{% endif %}
      </span>
      {% lucide "chevron-down" class="h-3.5 w-3.5 shrink-0 text-zinc-400" size=14 %}
    </button>
    <input
      type="hidden"
      name="snapshot_filename"
      id="import-snapshot-filename"
      value="{% if selected_snapshot %}{{ selected_snapshot }}{% elif available_snapshots %}{{ available_snapshots.0.filename }}{% endif %}"
    />

    <div data-popover aria-hidden="true" class="absolute top-full left-0 mt-1 w-full z-50 rounded-lg border border-zinc-200 bg-white p-1 shadow-lg dark:border-zinc-700 dark:bg-zinc-900 max-h-56 overflow-y-auto">
      <div role="menu" class="w-full flex flex-col gap-0.5">
        {% for s in available_snapshots %}
          <div
            role="menuitemradio"
            class="flex items-center justify-between px-2.5 py-1.5 text-xs rounded-md text-zinc-700 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-zinc-800 cursor-pointer select-none transition-colors"
            onclick="selectSnapshotDropdown('{{ s.filename|escapejs }}')"
          >
            <span class="font-mono text-xs truncate">{{ s.filename }}</span>
            <span class="text-[11px] text-zinc-400">{{ s.size_formatted }}</span>
          </div>
        {% empty %}
          <div class="px-2.5 py-1.5 text-xs text-zinc-400">No snapshots found in db_snapshots/</div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
