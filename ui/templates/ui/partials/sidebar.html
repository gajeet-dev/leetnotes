<aside id="sidebar" class="sidebar" data-side="left">
  <nav aria-label="Main navigation">
    <header>
      <span class="px-2 text-lg font-semibold">Leetnotes</span>
    </header>
    <section>
      <div role="group" aria-labelledby="nav-main-label">
        <h3 id="nav-main-label">Menu</h3>
        <ul>
          <li>
            <a href="{% url 'ui:dashboard' %}" {% if active == 'dashboard' %}aria-current="page"{% endif %}>
              {% lucide "layout-dashboard" %}
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="{% url 'ui:problems' %}" {% if active == 'problems' %}aria-current="page"{% endif %}>
              {% lucide "list" %}
              <span>Problems</span>
            </a>
          </li>
          <li>
            <a href="#">
              {% lucide "clipboard-check" %}
              <span>Review</span>
            </a>
          </li>
          <li>
            <a href="{% url 'ui:settings' %}" {% if active == 'settings' %}aria-current="page"{% endif %}>
              {% lucide "settings" %}
              <span>Settings</span>
            </a>
          </li>
        </ul>
      </div>
    </section>
    <footer class="mt-auto border-t border-zinc-200 p-2 dark:border-zinc-800">
      <button
        type="button"
        id="theme-toggle"
        class="flex w-full items-center justify-between rounded-md px-3 py-2 text-sm font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-zinc-100"
        onclick="toggleTheme()"
        title="Toggle theme"
      >
        <span class="flex items-center gap-2">
          <!-- Moon icon for light mode (switch to dark) -->
          {% lucide "moon" id="theme-moon" class="hidden h-4 w-4 dark:block" %}
          <!-- Sun icon for dark mode (switch to light) -->
          {% lucide "sun" id="theme-sun" class="block h-4 w-4 dark:hidden" %}
          <span id="theme-text" class="text-xs">Theme</span>
        </span>
        <span class="text-[10px] uppercase tracking-wider opacity-60" id="theme-mode-label">Mode</span>
      </button>
      <script>
        function toggleTheme() {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
      </script>
    </footer>
  </nav>
</aside>
