<div id="task-item-{{ item.id }}" class="rounded-2xl border border-zinc-200 bg-white shadow-sm dark:border-zinc-800/80 dark:bg-zinc-950 overflow-hidden transition-all" data-waiting="{% if item.status == 'needs_input' %}true{% else %}false{% endif %}">
  <!-- Clickable Header Trigger (Reusable Partial for In-Place Updates) -->
  {% include "ui/partials/task_item_summary.html" with item=item %}

  <!-- Collapsible Details Body: Vertical Pipeline Timeline (Collapsed by default) -->
  <div
    id="item-content-{{ item.id }}"
    class="border-t border-zinc-200 bg-zinc-50/40 dark:border-zinc-800/80 dark:bg-zinc-950 hidden"
  >
    <div id="item-stages-{{ item.id }}" class="p-5 space-y-6">
      {% include "ui/partials/task_item_stages.html" with item=item manual_error=manual_error %}
    </div>
  </div>

  <!-- Note Review Modal Wrapper (Outside item-stages so swapping item-stages never affects or resets the modal) -->
  <div id="note-modal-wrapper-{{ item.id }}">
    {% if item.note_rendered_html %}
      {% include "ui/partials/note_review_modal.html" with item=item %}
    {% endif %}
  </div>
</div>
