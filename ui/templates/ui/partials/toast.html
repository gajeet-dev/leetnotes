<div
  role="status"
  class="toast-notification pointer-events-auto flex items-center justify-between gap-3 rounded-xl border p-3.5 shadow-lg backdrop-blur-sm transition-all duration-300 ease-out transform translate-y-0 opacity-100 {% if status == 'success' %}border-emerald-200 bg-white/95 text-zinc-900 dark:border-emerald-900/60 dark:bg-zinc-900/95 dark:text-zinc-100{% elif status == 'warning' %}border-amber-200 bg-white/95 text-zinc-900 dark:border-amber-900/60 dark:bg-zinc-900/95 dark:text-zinc-100{% else %}border-rose-200 bg-white/95 text-zinc-900 dark:border-rose-900/60 dark:bg-zinc-900/95 dark:text-zinc-100{% endif %}"
>
  <div class="flex items-center gap-2.5 min-w-0">
    {% if status == 'success' %}
      <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-emerald-50 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-400">
        {% lucide "check" class="w-4 h-4" size=16 %}
      </div>
    {% elif status == 'warning' %}
      <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-amber-50 text-amber-600 dark:bg-amber-950/60 dark:text-amber-400">
        {% lucide "triangle-alert" class="w-4 h-4" size=16 %}
      </div>
    {% else %}
      <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-rose-50 text-rose-600 dark:bg-rose-950/60 dark:text-rose-400">
        {% lucide "circle-alert" class="w-4 h-4" size=16 %}
      </div>
    {% endif %}
    <p class="text-xs font-medium text-zinc-900 dark:text-zinc-100 leading-snug break-words">
      {{ message }}
    </p>
  </div>
  <button
    type="button"
    onclick="dismissToast(this.closest('.toast-notification'))"
    class="rounded-md p-1 text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100 dark:text-zinc-500 dark:hover:text-zinc-300 dark:hover:bg-zinc-800 transition-colors cursor-pointer shrink-0"
    title="Dismiss"
  >
    {% lucide "x" class="w-3.5 h-3.5" size=14 %}
  </button>
</div>
