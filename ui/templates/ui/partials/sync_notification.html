<div
  id="sync-notification"
  class="animate-in fade-in slide-in-from-top-2 duration-200 mt-2 flex items-center justify-between rounded-lg border p-3 text-xs shadow-sm {% if toast_type == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-800/60 dark:bg-emerald-950/40 dark:text-emerald-300{% elif toast_type == 'warning' %}border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-800/60 dark:bg-amber-950/40 dark:text-amber-300{% else %}border-rose-200 bg-rose-50 text-rose-800 dark:border-rose-800/60 dark:bg-rose-950/40 dark:text-rose-300{% endif %}"
>
  <div class="flex items-center gap-2">
    {% if toast_type == 'success' %}
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    {% elif toast_type == 'warning' %}
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    {% else %}
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg>
    {% endif %}
    <span>{{ message }}</span>
  </div>
  <button
    type="button"
    class="ml-3 text-current opacity-60 hover:opacity-100"
    onclick="this.parentElement.remove()"
    title="Dismiss"
  >
    ✕
  </button>
</div>
