<!-- Updated Overflow Menu Pin Toggle Item -->
<div id="task-overflow-pin-toggle" {% if not is_batch %}hx-swap-oob="outerHTML"{% endif %}>
  <form hx-post="{% url 'ui:task_pin_all' task.id %}" hx-target="#task-overflow-pin-toggle" hx-swap="outerHTML">
    {% csrf_token %}
    <button type="submit" class="w-full text-left px-3 py-2 text-zinc-700 hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-white flex items-center gap-2 transition-colors cursor-pointer">
      {% if all_submissions_pinned %}
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
      <span>Unpin All Submissions</span>
      {% else %}
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
      <span>Pin All Submissions</span>
      {% endif %}
    </button>
  </form>
</div>

<!-- OOB Swaps for each submission pin button -->
{% for item in items %}
{% if item.latest_submission %}
<div hx-swap-oob="outerHTML:#submission-pin-btn-{{ item.latest_submission.id }}">
  {% include "ui/partials/submission_pin_button.html" with submission=item.latest_submission %}
</div>
{% endif %}
{% endfor %}
