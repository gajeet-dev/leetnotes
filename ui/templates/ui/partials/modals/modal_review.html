<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-xs transition-opacity" onclick="closeStageModal()"></div>

  <!-- Modal Card -->
  <div class="relative z-10 w-full max-w-3xl sm:max-w-4xl max-h-[90vh] flex flex-col transform overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-2xl transition-all dark:border-zinc-800 dark:bg-zinc-900">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-zinc-200 px-6 py-4 dark:border-zinc-800">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-100 text-blue-700 dark:bg-blue-950/80 dark:text-blue-400">
          {% lucide "eye" class="h-5 w-5" %}
        </div>
        <div>
          <h3 class="text-base font-bold text-zinc-900 dark:text-zinc-100">
            Review AI Note · {{ problem.leetcode_id }}. {{ problem.title }}
          </h3>
          <p class="text-xs text-zinc-500 dark:text-zinc-400">
            Generated by <span class="font-semibold text-zinc-700 dark:text-zinc-300">{{ response.provider_name|default:"AI Provider" }}</span> ({{ response.model_name|default:"active draft" }}). Approve to save to Obsidian.
          </p>
        </div>
      </div>
      <button type="button" onclick="closeStageModal()" class="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-100 hover:text-zinc-700 dark:hover:bg-zinc-800 dark:hover:text-zinc-200">
        {% lucide "x" class="h-5 w-5" %}
      </button>
    </div>

    <!-- Tabs switcher -->
    <div class="flex items-center gap-2 border-b border-zinc-200 px-6 py-2.5 bg-zinc-50/50 dark:border-zinc-800 dark:bg-zinc-950/30">
      <button
        type="button"
        id="btn-tab-rendered"
        onclick="switchReviewTab('rendered')"
        class="inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-1.5 text-xs font-semibold text-zinc-900 shadow-xs border border-zinc-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 cursor-pointer"
      >
        {% lucide "file-text" class="h-3.5 w-3.5" %}
        Rendered Preview
      </button>
      <button
        type="button"
        id="btn-tab-raw"
        onclick="switchReviewTab('raw')"
        class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 cursor-pointer"
      >
        {% lucide "code" class="h-3.5 w-3.5" %}
        Raw Markdown
      </button>
    </div>

    <!-- Content (scrollable) -->
    <div class="flex-1 overflow-y-auto p-6 min-h-[300px]">
      <!-- Tab 1: Rendered HTML -->
      <div id="review-rendered-content" class="prose prose-zinc dark:prose-invert max-w-none text-sm leading-relaxed">
        {{ rendered_html|safe }}
      </div>

      <!-- Tab 2: Raw Markdown (hidden by default) -->
      <div id="review-raw-content" class="hidden rounded-xl border border-zinc-200 bg-zinc-50/80 p-4 font-mono text-xs text-zinc-800 select-all whitespace-pre-wrap dark:border-zinc-800 dark:bg-zinc-950/80 dark:text-zinc-200">
        {{ raw_markdown }}
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="flex items-center justify-between border-t border-zinc-100 px-6 py-4 dark:border-zinc-800 bg-zinc-50/50 dark:bg-zinc-950/40">
      <button
        type="button"
        hx-post="{% url 'ui:reject_review' item.pk %}"
        hx-target="#workbench-table-container"
        hx-swap="outerHTML"
        class="inline-flex items-center gap-2 rounded-xl border border-rose-300 bg-rose-50 px-4 py-2 text-sm font-semibold text-rose-700 hover:bg-rose-100 dark:border-rose-900/60 dark:bg-rose-950/30 dark:text-rose-400 dark:hover:bg-rose-950/60 cursor-pointer transition-colors"
      >
        {% lucide "rotate-ccw" class="h-4 w-4" %}
        <span>Reject & Regenerate</span>
      </button>

      <div class="flex items-center gap-3">
        <button
          type="button"
          onclick="closeStageModal()"
          class="rounded-xl border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-700 hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700 cursor-pointer transition-colors"
        >
          Cancel
        </button>
        <button
          type="button"
          hx-post="{% url 'ui:approve_review' item.pk %}"
          hx-target="#workbench-table-container"
          hx-swap="outerHTML"
          class="inline-flex items-center gap-2 rounded-xl bg-emerald-600 px-5 py-2 text-sm font-semibold text-white hover:bg-emerald-500 dark:bg-emerald-500 dark:hover:bg-emerald-400 cursor-pointer transition-colors shadow-xs"
        >
          {% lucide "check" class="h-4 w-4" %}
          <span>Approve & Save Note</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  function switchReviewTab(tab) {
    const renderedEl = document.getElementById('review-rendered-content');
    const rawEl = document.getElementById('review-raw-content');
    const btnRendered = document.getElementById('btn-tab-rendered');
    const btnRaw = document.getElementById('btn-tab-raw');

    if (tab === 'rendered') {
      renderedEl.classList.remove('hidden');
      rawEl.classList.add('hidden');
      btnRendered.className = 'inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-1.5 text-xs font-semibold text-zinc-900 shadow-xs border border-zinc-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 cursor-pointer';
      btnRaw.className = 'inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 cursor-pointer';
    } else {
      renderedEl.classList.add('hidden');
      rawEl.classList.remove('hidden');
      btnRaw.className = 'inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-1.5 text-xs font-semibold text-zinc-900 shadow-xs border border-zinc-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 cursor-pointer';
      btnRendered.className = 'inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 cursor-pointer';
    }
  }
</script>
