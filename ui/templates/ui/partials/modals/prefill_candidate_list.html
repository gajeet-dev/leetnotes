<div id="prefill-candidates-container" class="flex flex-col gap-2">
  {% if not responses %}
    <div class="rounded-lg border border-dashed border-zinc-200 p-6 text-center text-xs text-zinc-500 dark:border-zinc-800 dark:text-zinc-400">
      No previous AI prefill responses saved for this problem.
    </div>
  {% endif %}

  {% for resp in responses %}
    <div
      id="resp-card-{{ resp.id }}"
      class="flex items-center justify-between rounded-lg border p-2.5 transition-colors cursor-pointer {% if resp.id == selected_response.id or not selected_response and resp.is_active %}border-blue-500 bg-blue-50/50 dark:border-blue-500 dark:bg-blue-950/30{% else %}border-zinc-200 bg-white hover:bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900 dark:hover:bg-zinc-850{% endif %}"
      onclick="selectPrefillCandidate('{{ resp.id }}')"
    >
      <div class="flex items-center gap-2.5 min-w-0">
        <input
          type="radio"
          name="selected_response_id"
          value="{{ resp.id }}"
          id="resp-radio-{{ resp.id }}"
          {% if resp.id == selected_response.id or not selected_response and resp.is_active %}checked{% endif %}
          class="h-4 w-4 text-blue-600 focus:ring-blue-500 dark:border-zinc-700 dark:bg-zinc-800 cursor-pointer"
          hx-get="{% url 'ui:preview_ai_response' item.pk resp.id %}"
          hx-target="#prefill-preview-pane"
          hx-swap="innerHTML"
          hx-trigger="click, change"
          onclick="event.stopPropagation(); selectPrefillCandidate('{{ resp.id }}');"
        />
        <label for="resp-radio-{{ resp.id }}" class="flex flex-col min-w-0 cursor-pointer">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-bold text-zinc-900 dark:text-zinc-100 truncate">
              {{ resp.model_name|default:resp.provider_name|default:"AI Response" }}
            </span>
            {% if resp.is_active %}
              <span class="rounded bg-emerald-100 px-1.5 py-0.2 text-[10px] font-bold text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">
                Active
              </span>
            {% endif %}
          </div>
          <span class="text-[11px] font-mono text-zinc-400 dark:text-zinc-500">
            {{ resp.created_at|date:"M d, Y · H:i" }}
          </span>
        </label>
      </div>

      <!-- Delete Candidate Action -->
      <button
        type="button"
        hx-delete="{% url 'ui:delete_ai_response' item.pk resp.id %}"
        hx-target="#prefill-candidates-container"
        hx-swap="outerHTML"
        hx-confirm="Are you sure you want to delete this AI prefill response?"
        class="rounded p-1 text-zinc-400 hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-rose-950/50 dark:hover:text-rose-400 transition-colors cursor-pointer"
        title="Delete this prefill response"
        onclick="event.stopPropagation();"
      >
        {% lucide "trash-2" class="h-3.5 w-3.5" %}
      </button>
    </div>
  {% endfor %}
</div>

<script>
  function selectPrefillCandidate(respId) {
    const radio = document.getElementById('resp-radio-' + respId);
    if (radio && !radio.checked) {
      radio.checked = true;
      htmx.trigger(radio, 'click');
    }
    const form = document.getElementById('use-existing-form');
    if (form) {
      form.setAttribute('hx-post', `/tasks/items/{{ item.pk }}/prefill/select-response/${respId}/`);
      htmx.process(form);
    }
    document.querySelectorAll('#prefill-candidates-container > div').forEach(card => {
      card.classList.remove('border-blue-500', 'bg-blue-50/50', 'dark:border-blue-500', 'dark:bg-blue-950/30');
      card.classList.add('border-zinc-200', 'bg-white', 'dark:border-zinc-800', 'dark:bg-zinc-900');
    });
    const clickedCard = document.getElementById('resp-card-' + respId);
    if (clickedCard) {
      clickedCard.classList.remove('border-zinc-200', 'bg-white', 'dark:border-zinc-800', 'dark:bg-zinc-900');
      clickedCard.classList.add('border-blue-500', 'bg-blue-50/50', 'dark:border-blue-500', 'dark:bg-blue-950/30');
    }
  }
</script>
