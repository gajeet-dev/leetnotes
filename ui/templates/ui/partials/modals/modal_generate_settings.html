<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-zinc-950/60 backdrop-blur-xs transition-opacity"
    onclick="document.getElementById('modal-container').innerHTML = '';"
  ></div>

  <!-- Dialog Modal -->
  <div class="relative w-full max-w-lg rounded-2xl border border-zinc-200 bg-white p-6 shadow-2xl dark:border-zinc-800 dark:bg-zinc-900 z-10 transition-all flex flex-col gap-5">
    <!-- Header -->
    <div class="flex items-start justify-between">
      <div class="flex flex-col gap-1">
        <div class="flex items-center gap-2">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900">
            {% lucide "sparkles" class="h-4 w-4" %}
          </div>
          <h3 class="text-base font-bold text-zinc-900 dark:text-zinc-50">Generate Notes</h3>
        </div>
        <p class="text-xs text-zinc-500 dark:text-zinc-400">
          Configure generation settings for <span class="font-semibold text-zinc-800 dark:text-zinc-200">{{ problem_count }} selected problem{{ problem_count|pluralize }}</span>.
        </p>
      </div>

      <button
        type="button"
        onclick="document.getElementById('modal-container').innerHTML = '';"
        class="rounded-lg p-1 text-zinc-400 hover:bg-zinc-100 hover:text-zinc-600 dark:hover:bg-zinc-800 dark:hover:text-zinc-300 transition-colors cursor-pointer"
        title="Close modal"
      >
        {% lucide "x" class="h-4 w-4" %}
      </button>
    </div>

    <!-- Form -->
    <form
      hx-post="{% url 'ui:tasks_create' %}"
      hx-target="#workbench-table-container"
      hx-swap="outerHTML"
      class="flex flex-col gap-4"
    >
      {% csrf_token %}
      {% for pid in problem_ids %}
        <input type="hidden" name="problem_ids" value="{{ pid }}" />
      {% endfor %}

      <!-- AI Provider -->
      <div class="flex flex-col gap-1.5">
        <label for="modal-provider" class="text-xs font-bold text-zinc-700 dark:text-zinc-300">
          AI Provider
        </label>
        <select
          id="modal-provider"
          name="provider"
          class="h-9 w-full rounded-lg border border-zinc-300 bg-white px-3 text-xs font-semibold text-zinc-800 focus:border-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900 dark:border-zinc-700 dark:bg-zinc-950 dark:text-zinc-200 dark:focus:border-zinc-100 cursor-pointer shadow-2xs"
        >
          {% for p in providers %}
            <option value="{{ p }}" {% if p == default_provider %}selected{% endif %}>
              {{ p|title }}{% if p == default_provider %} (Default){% endif %}
            </option>
          {% endfor %}
          <option value="manual" {% if default_provider == "manual" %}selected{% endif %}>
            Manual (Paste response from web chat)
          </option>
        </select>
      </div>

      <!-- AI Model Override -->
      <div class="flex flex-col gap-1.5">
        <label for="modal-model" class="text-xs font-bold text-zinc-700 dark:text-zinc-300">
          Model Override <span class="text-zinc-400 font-normal">(optional)</span>
        </label>
        <input
          type="text"
          id="modal-model"
          name="model"
          value="{{ default_model }}"
          placeholder="e.g. claude-3-5-sonnet, gemini-1.5-flash (leave blank for default)"
          class="h-9 w-full rounded-lg border border-zinc-300 bg-white px-3 font-mono text-xs text-zinc-800 placeholder:text-zinc-400 focus:border-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900 dark:border-zinc-700 dark:bg-zinc-950 dark:text-zinc-200 dark:placeholder:text-zinc-500 shadow-2xs"
        />
      </div>

      <!-- Toggles & Checkboxes -->
      <div class="flex flex-col gap-2.5 pt-1 border-t border-zinc-100 dark:border-zinc-800">
        <!-- Review Toggle -->
        <label class="flex items-center gap-2.5 cursor-pointer select-none">
          <input
            type="checkbox"
            name="review"
            value="true"
            {% if review_default %}checked{% endif %}
            class="h-4 w-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900 dark:border-zinc-700 dark:bg-zinc-950 dark:focus:ring-zinc-200 cursor-pointer"
          />
          <div class="flex flex-col">
            <span class="text-xs font-bold text-zinc-800 dark:text-zinc-200">Require Manual Review</span>
            <span class="text-[11px] text-zinc-500 dark:text-zinc-400">Pause for your approval before writing the note to your vault</span>
          </div>
        </label>

        <!-- Force Regenerate Prefill -->
        <label class="flex items-center gap-2.5 cursor-pointer select-none">
          <input
            type="checkbox"
            name="regenerate_prefill"
            value="true"
            class="h-4 w-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900 dark:border-zinc-700 dark:bg-zinc-950 dark:focus:ring-zinc-200 cursor-pointer"
          />
          <div class="flex flex-col">
            <span class="text-xs font-bold text-zinc-800 dark:text-zinc-200">Force Regenerate AI Draft</span>
            <span class="text-[11px] text-zinc-500 dark:text-zinc-400">Re-prompt the AI provider even if a previous draft exists</span>
          </div>
        </label>

        <!-- Refetch LeetCode Data -->
        <label class="flex items-center gap-2.5 cursor-pointer select-none">
          <input
            type="checkbox"
            name="refetch"
            value="true"
            class="h-4 w-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900 dark:border-zinc-700 dark:bg-zinc-950 dark:focus:ring-zinc-200 cursor-pointer"
          />
          <div class="flex flex-col">
            <span class="text-xs font-bold text-zinc-800 dark:text-zinc-200">Refetch from LeetCode</span>
            <span class="text-[11px] text-zinc-500 dark:text-zinc-400">Fetch latest problem statement and accepted submissions again</span>
          </div>
        </label>
      </div>

      <!-- Action Buttons -->
      <div class="mt-2 flex items-center justify-end gap-2.5">
        <button
          type="button"
          onclick="document.getElementById('modal-container').innerHTML = '';"
          class="h-9 rounded-lg border border-zinc-300 bg-white px-4 text-xs font-semibold text-zinc-700 hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700 cursor-pointer transition-colors"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="inline-flex h-9 items-center justify-center gap-2 rounded-lg bg-zinc-900 px-4 text-xs font-semibold text-white shadow-sm hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-zinc-200 cursor-pointer transition-colors"
        >
          {% lucide "play" class="h-3.5 w-3.5" %}
          <span>Start Generation</span>
        </button>
      </div>
    </form>
  </div>
</div>
