{% extends "ui/base.html" %}
{% block title %}Generate Notes · Leetnotes{% endblock %}

{% block content %}
<div class="mx-auto max-w-5xl space-y-5 pb-12">
  {% csrf_token %}

  <!-- Top Bar: Title & Generate Notes Action Button -->
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between border-b border-zinc-200 pb-4 dark:border-zinc-800">
    <!-- Back to Dashboard & Title -->
    <div class="flex items-center gap-3">
      <a
        href="{% url 'ui:dashboard' %}"
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-zinc-200 bg-white text-zinc-600 shadow-sm transition-colors hover:bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:bg-zinc-800"
        title="Back to Dashboard"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-zinc-900 dark:text-zinc-50">Generate Notes</h1>
        <p class="text-xs text-zinc-500 dark:text-zinc-400">
          Select solved algorithm problems to run through the AI note generation pipeline.
        </p>
      </div>
    </div>

    <!-- Right Controls: Generate Notes Button -->
    <div class="flex items-center gap-2.5">
      <button
        type="button"
        id="generate-notes-btn"
        onclick="openTaskPreviewModal()"
        class="inline-flex h-9 items-center gap-1.5 rounded-lg bg-zinc-900 px-4 text-xs font-semibold text-white shadow-sm transition-all hover:bg-zinc-800 dark:bg-zinc-50 dark:text-zinc-900 dark:hover:bg-zinc-200 cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        <span>Generate Notes</span>
        <span id="selected-badge" class="ml-1 hidden h-4 min-w-4 px-1 items-center justify-center rounded-full bg-white text-[10px] font-bold text-zinc-900 dark:bg-zinc-900 dark:text-zinc-100">
          0
        </span>
      </button>
    </div>
  </div>

  <!-- Filter & Search Toolbar (Just like Problems page, placed above the table) -->
  <form
    id="filter-form"
    hx-get="{% url 'ui:generate_notes' %}"
    hx-target="#generate-table-container"
    hx-swap="outerHTML"
    hx-trigger="change from:select, submit"
    class="flex flex-wrap items-center gap-2.5 rounded-xl border border-zinc-200 bg-white p-2.5 shadow-sm dark:border-zinc-800 dark:bg-zinc-950"
  >
    <!-- Search Input (Fixed dark mode focus background) -->
    <div class="relative min-w-[200px] flex-1">
      <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-zinc-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <input
        type="search"
        name="q"
        value="{{ query }}"
        placeholder="Search by ID, title, or slug..."
        class="h-9 w-full rounded-lg border border-zinc-200 bg-zinc-50/50 pl-9 pr-3 text-sm text-zinc-900 placeholder:text-zinc-400 focus:border-zinc-900 focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 dark:border-zinc-800 dark:bg-zinc-900/60 dark:text-zinc-100 dark:placeholder:text-zinc-500 dark:focus:border-zinc-100 dark:focus:bg-zinc-900 dark:focus:ring-zinc-100"
        hx-get="{% url 'ui:generate_notes' %}"
        hx-target="#generate-table-container"
        hx-swap="outerHTML"
        hx-include="#filter-form"
        hx-trigger="input changed delay:300ms, search"
      />
    </div>

    <!-- Difficulty Filter -->
    <div class="w-36">
      <select name="difficulty" class="h-9 w-full rounded-lg border border-zinc-200 bg-zinc-50/50 px-2.5 text-sm text-zinc-900 focus:border-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900 dark:border-zinc-800 dark:bg-zinc-900/60 dark:text-zinc-100 dark:focus:border-zinc-100">
        <option value="">Difficulty: All</option>
        {% for diff in difficulties %}
        <option value="{{ diff }}" {% if difficulty == diff %}selected{% endif %}>{{ diff }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Notes Filter (Saved on Disk vs AI Draft Ready vs Needs Note) -->
    <div class="w-40">
      <select name="notes" class="h-9 w-full rounded-lg border border-zinc-200 bg-zinc-50/50 px-2.5 text-sm text-zinc-900 focus:border-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900 dark:border-zinc-800 dark:bg-zinc-900/60 dark:text-zinc-100 dark:focus:border-zinc-100">
        <option value="">Notes: All</option>
        <option value="has_note" {% if notes_filter == 'has_note' %}selected{% endif %}>Saved on Disk</option>
        <option value="has_draft" {% if notes_filter == 'has_draft' %}selected{% endif %}>AI Draft Ready</option>
        <option value="no_note" {% if notes_filter == 'no_note' %}selected{% endif %}>Needs Note</option>
      </select>
    </div>

    <!-- Reset Filters Button (Warning/Danger Outline) -->
    <a
      href="{% url 'ui:generate_notes' %}"
      class="inline-flex h-9 items-center justify-center gap-1.5 rounded-lg border border-rose-300/80 bg-rose-50/50 px-3 text-xs font-semibold text-rose-700 transition-colors hover:bg-rose-100 hover:text-rose-800 dark:border-rose-900/50 dark:bg-rose-950/20 dark:text-rose-400 dark:hover:bg-rose-950/40"
      title="Reset all filters"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      <span>Reset</span>
    </a>
  </form>

  <!-- Unified Solved Algorithms Table (Suggested + Other Solved) -->
  {% include "ui/partials/generate_table.html" %}

</div>

<script>
  function toggleSuggestedRows() {
    const rows = document.querySelectorAll('.suggested-row');
    const label = document.getElementById('suggested-toggle-label');
    const icon = document.getElementById('suggested-toggle-icon');
    if (!rows.length) return;
    const isHidden = rows[0].classList.contains('hidden');
    rows.forEach(r => r.classList.toggle('hidden'));
    if (label) label.textContent = isHidden ? 'Collapse' : 'Expand';
    if (icon) icon.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(-90deg)';
  }

  function toggleAllCheckboxesInTable(master) {
    const checkboxes = document.querySelectorAll('.problem-select-checkbox');
    checkboxes.forEach(cb => {
      const tr = cb.closest('tr');
      if (tr && !tr.classList.contains('hidden')) {
        cb.checked = master.checked;
      }
    });
    updateSelectionCount();
  }

  function updateSelectionCount() {
    const checked = document.querySelectorAll('.problem-select-checkbox:checked');
    const uniqueIds = new Set();
    checked.forEach(cb => uniqueIds.add(cb.value));
    const badge = document.getElementById('selected-badge');
    if (!badge) return;
    if (uniqueIds.size > 0) {
      badge.textContent = uniqueIds.size;
      badge.classList.remove('hidden');
      badge.classList.add('inline-flex');
    } else {
      badge.classList.add('hidden');
      badge.classList.remove('inline-flex');
    }
  }

  document.body.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target && evt.detail.target.id === 'generate-table-container') {
      updateSelectionCount();
    }
  });

  function openTaskPreviewModal() {
    const checked = document.querySelectorAll('.problem-select-checkbox:checked');
    if (!checked.length) {
      alert("Please select at least one problem to generate notes.");
      return;
    }
    const ids = Array.from(checked).map(cb => cb.value);
    const formData = new FormData();
    ids.forEach(id => formData.append('problem_ids', id));

    // Get CSRF cookie or token
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
      (document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1] || '');

    if (csrfToken) formData.append('csrfmiddlewaretoken', csrfToken);

    fetch('{% url "ui:task_preview_modal" %}', {
      method: 'POST',
      headers: {
        'X-CSRFToken': csrfToken,
        'HX-Request': 'true',
      },
      body: formData,
    })
    .then(res => res.text())
    .then(html => {
      const container = document.getElementById('task-modal-container');
      container.innerHTML = html;
      htmx.process(container);
    });
  }

  function closeTaskModal() {
    const container = document.getElementById('task-modal-container');
    if (container) container.innerHTML = '';
  }
</script>

<!-- Pre-Run Configuration Modal Container -->
<div id="task-modal-container"></div>
{% endblock %}
