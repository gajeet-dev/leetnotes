{% extends "admin/change_list.html" %} {% block extrastyle %} {{ block.super }}
<style>
  .object-tools li.discover-tool form {
    margin: 0;
    padding: 0;
  }
  .object-tools li.discover-tool button {
    display: block;
    float: left;
    padding: 3px 12px;
    border: 0;
    border-radius: 15px;
    background: #7c3aed;
    color: #ffffff;
    font-family: inherit;
    font-size: 0.7125rem;
    font-weight: 400;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    line-height: inherit;
    cursor: pointer;
  }
  .object-tools li.discover-tool button:hover,
  .object-tools li.discover-tool button:focus {
    background: #6d28d9;
  }
</style>
{% endblock %} {% block object-tools-items %}
<li class="discover-tool">
  <form method="post" action="{% url 'admin:problems_problem_check_recent' %}">
    {% csrf_token %}
    <button type="submit">Check recent submissions</button>
  </form>
</li>
<li class="discover-tool">
  <form method="post" action="{% url 'admin:problems_problem_discover' %}">
    {% csrf_token %}
    <button type="submit">Discover problems</button>
  </form>
</li>
{{ block.super }} {% endblock %}
